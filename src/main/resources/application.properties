spring.application.name=baozistore

# Banco MySQL local. O banco "baozistore" e criado sozinho na primeira execucao.
spring.datasource.url=jdbc:mysql://localhost:3306/baozistore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=

# A senha fica no arquivo local.properties, na raiz do projeto (fora do Git).
# Copie local.properties.example para local.properties e coloque a sua senha.
spring.config.import=optional:file:./local.properties

# Cria e atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
